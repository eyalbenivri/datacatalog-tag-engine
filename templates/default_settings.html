<!DOCTYPE html>
<meta charset="utf-8">
  <head>
    <title>Tag Engine</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
  </head>  
    <body>
	    {% if settings == 1 %}
	    <table><tr><td>
	    &nbsp;<span style="color:green;">Settings Saved!</span>
         </td></tr></table><p>
	    {% endif %}
	    
	   <div class="pagetitle">
	   <h1>Tag Engine for Data Catalog</h1>
        </div>
	   <div class="header">
	   <h2>Default Tag Template Settings</h2>
	   </div>
	   <span style="color:#9d9a9a;">
		   <h6>&nbsp;Set your default Tag Template preferences (template id, project id, and region) to avoid retyping them into the text fields each time you use Tag Engine. 

		   </h6>
	   </span> 
         <form method="post" action="/set_default">
		    <table>
		        <tr>
                    <td>&nbsp;<label for="template_id">Tag Template Id:</label></td>
		          <td>&nbsp;<input type="text" name="template_id" value="{{ template_id }}" placeholder="{your_template_id}" style="width: 150px;padding: 3px;"></td>
			   </tr>
		        <tr>
                    <td>&nbsp;<label for="project_id">Tag Template's Project Id:</label></td>
		          <td>&nbsp;<input type="text" name="project_id" value="{{ project_id }}" placeholder="{your_project_id}" style="width: 150px;padding: 3px;"></td>
			   </tr>
		        <tr>
                    <td>&nbsp;<label for="region">Tag Template's Region:</label></td>
		          <td>&nbsp;<input type="text" name="region" value="{{ region }}" placeholder="{your_region}" style="width: 150px;padding: 3px;"></td>
			   </tr>
                <tr>
                    <td><label for="group">Owning group:</label></td>
		          <td>
                      <select id="group" name="group_key" style="width: 150px;padding: 3px;" {% if groups|length < 2%}readonly{% endif %}>
                        {% if group|length > 1 %}<option {% if not group %}selected{% endif %} value="">No Default</option>{% endif %}
                        {% for g in groups %}
                          <option {% if g['group_key']==group['group_key'] %}selected{% endif %} value="{{ g['group_key'] }}">{{ g['data_domain'] }}</option>
                        {% endfor %}
                      </select>
                  </td>
			   </tr>
			   <tr>
			    <td></td>
			    <td>&nbsp;<input type="submit" value="Save Settings" name="submit" style="width: 160px;padding: 3px;"></td> 
			  </tr>
		    </table>
           
         </form>
	    <p>&nbsp;&nbsp;<a href="/">Homepage</a></p>
    </body>
</html>
